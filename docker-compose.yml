version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DJANGO_SETTINGS_MODULE=config.settings.demo
    volumes:
      # Persist SQLite + uploads across container restarts so the demo
      # doesn't re-migrate from scratch every boot.
      - django_demo_data:/app/data
    restart: unless-stopped

volumes:
  django_demo_data:
